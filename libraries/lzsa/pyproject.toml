[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zxvideo-lzsa"
version = "0.1.0"
description = "Reusable raw LZSA2 tools, Z80 decoders and CPU-aware host optimization"
readme = "README.md"
requires-python = ">=3.10"
license = "Zlib"
license-files = ["LICENSE"]

[project.optional-dependencies]
native = ["z80==1.2.0"]

[project.scripts]
lzsa-library = "lzsa.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lzsa = ["asm/*.asm", "LICENSE"]
