<!doctype html><html lang="en"><meta charset="utf-8"><title>Spectrum CPU clock benchmark</title>
<h1>CPU and shared-clock benchmark</h1>
<p>Real instruction interpreter, banked RAM, bus and 50-Hz interrupts. No GPU or audio work.</p>
<button id="run">Run CPU benchmark</button><pre id="result">Ready</pre>
<script type="module">
const result=document.querySelector('#result');
const sources=Object.fromEntries(await Promise.all(['baseline','candidate','cpu-clock-workload'].map(async name=>{
  const response=await fetch(name+'.js');if(!response.ok)throw Error('Missing '+name+'.js');return[name,await response.text()];
})));
const hash=async data=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data))).map(x=>x.toString(16).padStart(2,'0')).join('');
async function trial(name,kind){
  const iframe=document.createElement('iframe');iframe.hidden=true;document.body.append(iframe);const w=iframe.contentWindow;
  try{
    w.eval('var now=0,tick;Object.defineProperty(window,"performance",{value:{now:()=>now}});setInterval=fn=>{tick=fn;return 1};clearInterval=()=>{};');
    w.eval(sources[name]+'\n'+sources['cpu-clock-workload']);
    w.eval('var h=cpuClockWorkload("'+kind+'");h.clock.run();function advance(ms){var until=now+ms;while(now<until){now+=4;tick();}}advance(1000);');
    const start=performance.now();w.eval('advance(20000)');const ms=performance.now()-start;
    const identity=JSON.parse(w.eval('JSON.stringify({cpu:h.cpu.get_state(),t:h.clock.get_tstates(),interrupts:h.interrupts})'));
    identity.memory=await hash(w.eval('var b=h.bus;Uint8Array.from({length:65536},(_,a)=>b.mem_read(a))'));
    identity.interrupts={count:identity.interrupts.length,sha256:await hash(new TextEncoder().encode(JSON.stringify(identity.interrupts)))};
    return{ms,identity};
  }finally{iframe.remove();}
}
document.querySelector('#run').onclick=async()=>{
  document.querySelector('#run').disabled=true;
  try{
    const rows=[],identities={};
    for(const kind of ['alu','copy','indexed','flow'])for(let pair=0;pair<5;pair++)for(const name of pair&1?['candidate','baseline']:['baseline','candidate']){
      result.textContent=`Running ${kind} ${name} ${pair+1}/5`;await new Promise(resolve=>requestAnimationFrame(resolve));
      const value=await trial(name,kind);identities[kind]??=value.identity;
      if(JSON.stringify(value.identity)!==JSON.stringify(identities[kind]))throw Error('Machine identity mismatch '+kind);
      rows.push({kind,pair,name,ms:value.ms});
    }
    const median=values=>values.sort((a,b)=>a-b)[Math.floor(values.length/2)];
    const summary=Object.keys(identities).map(kind=>{const ms=name=>median(rows.filter(r=>r.kind===kind&&r.name===name).map(r=>r.ms));
      const beforeMs=ms('baseline'),afterMs=ms('candidate');return{kind,beforeMs,afterMs,reductionPercent:100*(1-afterMs/beforeMs)};});
    const hashes=Object.fromEntries(await Promise.all(['baseline','candidate'].map(async n=>[n,await hash(new TextEncoder().encode(sources[n]))])));
    result.textContent=JSON.stringify({browser:navigator.userAgent,hashes,summary,rows,identities,allExact:true},null,2);
  }catch(error){result.textContent=error.stack;}finally{document.querySelector('#run').disabled=false;}
};
</script></html>
