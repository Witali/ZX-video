<!doctype html><html><meta charset="utf-8"><title>Spectrum WebGL streaming benchmark</title><style>body{font:16px system-ui;max-width:1000px;margin:32px auto;background:#101820;color:#ddd}button{font:inherit;padding:12px}pre{white-space:pre-wrap}iframe{display:none}</style><h1>WebGL streaming benchmark</h1><p>Two native banks, one visible surface; full and sparse updates. Each timed batch includes one final GPU completion barrier.</p><button id="run">Run benchmark</button><pre id="result">Ready</pre><script type="module">
const result=document.querySelector('#result');
const sources=Object.fromEntries(await Promise.all(['baseline','candidate'].map(async n=>[n,await(await fetch(n+'.js')).text()])));
const sha=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');
async function trial(name,kind){
 const frame=document.createElement('iframe');document.body.append(frame);const w=frame.contentWindow;w.eval(sources[name]);
 w.eval('var canvases=[document.createElement("canvas"),document.createElement("canvas"),document.createElement("canvas")];canvases.forEach((c,i)=>{c.width=i?256:576;c.height=i?192:448});var r=new WebGLRenderer(16,1,VAL_SCALE_METHOD_PRE);r.bind(canvases);r.drawBorder([0,0,0,255]);var data=[new Uint8Array(6912),new Uint8Array(6912)],dirty=[new Uint8Array(6144),new Uint8Array(6144)];var calls={finish:0,bufferData:0,bufferSubData:0,uploadedBytes:0};for(const gl of [r._layer0Ctx,r._layer1Ctx]){for(const method of ["finish","bufferData","bufferSubData"]){const fn=gl[method].bind(gl);gl[method]=function(...args){calls[method]++;if(method==="bufferData"&&ArrayBuffer.isView(args[1]))calls.uploadedBytes+=args[1].byteLength;if(method==="bufferSubData")calls.uploadedBytes+=args[2].byteLength;return fn(...args);}}}function advance(count,kind){for(var n=0;n<count;n++){const layer=n&1,d=data[layer],flags=dirty[layer];if(kind==="full"){for(var i=0;i<6144;i++)d[i]=(n*17+i*73+(i>>5))&255;flags.fill(1);}else if(kind==="sparse"){for(var j=0;j<64;j++){const i=(n*97+j*83)%6144;d[i]=(n*17+j*73)&255;flags[i]=1;}}for(var i=6144;i<6912;i++)d[i]=71; r.drawData(layer,d,flags,false,true);r.displayLayer(layer);}}');
 w.eval('dirty.forEach(d=>d.fill(1));advance(2,"full");advance(20,"'+kind+'");Object.keys(calls).forEach(k=>calls[k]=0)');
 const start=performance.now();w.eval('advance(200,"'+kind+'");r._screenCtx.finish()');const ms=performance.now()-start;
 const identity=w.eval('var gl=r._screenCtx,rgba=new Uint8Array(576*448*4);gl.readPixels(0,0,576,448,gl.RGBA,gl.UNSIGNED_BYTE,rgba);rgba');
 const calls=JSON.parse(w.JSON.stringify(w.calls)),version=w.eval('r._screenCtx.getParameter(r._screenCtx.VERSION)'),error=w.eval('r._screenCtx.getError()');
 if(error)throw Error('GL error '+error);const hash=await sha(identity);
 w.eval('for(const gl of [r._screenCtx,r._layer0Ctx,r._layer1Ctx])gl.getExtension("WEBGL_lose_context").loseContext()');frame.remove();return{ms,hash,calls,version};
}
document.querySelector('#run').onclick=async()=>{try{document.querySelector('#run').disabled=true;const rows=[],identities={};for(const kind of ['full','sparse','unchanged'])for(let pair=0;pair<5;pair++)for(const name of pair&1?['candidate','baseline']:['baseline','candidate']){result.textContent='Running '+kind+' '+name+' '+(pair+1)+'/5';await new Promise(r=>requestAnimationFrame(r));const r=await trial(name,kind);identities[kind]??=r.hash;if(r.hash!==identities[kind])throw Error('Pixel mismatch '+kind+' '+name);rows.push({kind,pair,name,...r});}const median=x=>x.sort((a,b)=>a-b)[Math.floor(x.length/2)];const summary=['full','sparse','unchanged'].map(kind=>{const before=median(rows.filter(r=>r.kind===kind&&r.name==='baseline').map(r=>r.ms)),after=median(rows.filter(r=>r.kind===kind&&r.name==='candidate').map(r=>r.ms));return{kind,before,after,reductionPercent:100*(1-after/before)}});result.textContent=JSON.stringify({browser:navigator.userAgent,framesPerTrial:200,summary,rows,identical:true},null,2);}catch(e){result.textContent=e.stack;}finally{document.querySelector('#run').disabled=false;}};
</script>
