<!doctype html><html lang="en"><meta charset="utf-8"><title>Spectrum renderer verification</title>
<script src="vendor/ayumi.js"></script><script src="vendor/zx-dream.js"></script>
<body><label><input id="webgl1" type="checkbox">Force WebGL 1</label>
<button id="fullscreen-check">Verify centered fullscreen and solid border</button><pre id="fullscreen-result">Ready</pre>
<button id="rows">Verify Spectrum scanline addresses and scaling</button><pre id="rows-result">Ready</pre>
<div id="row-screens" style="display:flex;gap:20px;flex-wrap:wrap"></div>
<button id="run">Compare native Canvas and WebGL pixels</button><pre id="result">Ready</pre>
<div id="screens" style="display:flex;gap:20px"></div>
<button id="switch">Test live switching and GPU recovery</button><pre id="switch-result">Ready</pre><div id="fixture" hidden></div>
<script>
const defaultGlContext=WebGLRenderer.prototype._glGetContext;
document.getElementById('webgl1').onchange=event=>{
  WebGLRenderer.prototype._glGetContext=event.target.checked
    ? function(canvas,options){return canvas.getContext('webgl',options);}:defaultGlContext;
};
document.getElementById('fullscreen-check').onclick=()=>{
  try {
    let borderPixels=0,rasterPixels=0;
    const cases=[];
    for(const renderer of [1,3]){
      const fixture=create(renderer,renderer===1?2:1);
      const native=new Uint8Array(6912);
      for(let y=0;y<192;y++)for(let x=0;x<32;x++){
        const offset=((y&192)<<5)|((y&7)<<8)|((y&56)<<2)|x;
        native[offset]=(y*17+x*43)&255;
      }
      for(let i=6144;i<6912;i++)native[i]=64|((i&7)||7);
      native.forEach((v,i)=>fixture.bus.mem_write(0x4000+i,v));
      for(const [width,height] of [[960,540],[540,960],[887,613],[576,448]]){
        fixture.visible.width=width;fixture.visible.height=height;
        const scale=Math.min(width/288,height/224);
        const w=Math.floor(256*scale),h=Math.floor(192*scale);
        const viewport={x:Math.round((width-w)/2),y:Math.round((height-h)/2),width:w,height:h};
        fixture.visible.spectrumViewport=width===576?null:viewport;
        const active=fixture.visible.spectrumViewport||{x:32,y:32,width:512,height:384};
        for(let color=0;color<8;color++){
          fixture.bus.var_write('port_fe_value',color);fixture.display.force_redraw();
          const pixels=readVisible(fixture);
          const border=[color&2?191:0,color&4?191:0,color&1?191:0,255];
          for(let y=0;y<height;y++)for(let x=0;x<width;x++){
            if(x>=active.x&&x<active.x+active.width&&y>=active.y&&y<active.y+active.height)continue;
            const p=(y*width+x)*4;
            if(border.some((v,c)=>pixels[p+c]!==v))throw Error(`Border mismatch renderer=${renderer} ${width}x${height} color=${color} at ${x},${y}`);
            borderPixels++;
          }
          for(let y=0;y<192;y++)for(let x=0;x<256;x++){
            const dx=active.x+Math.floor((x+.5)*active.width/256),dy=active.y+Math.floor((y+.5)*active.height/192);
            const p=(dy*width+dx)*4,offset=((y&192)<<5)|((y&7)<<8)|((y&56)<<2)|(x>>3);
            const attr=native[6144+(y>>3)*32+(x>>3)];
            const ink=native[offset]&(128>>(x&7))?attr&7:0;
            const expected=[ink&2?255:0,ink&4?255:0,ink&1?255:0,255];
            if(expected.some((v,c)=>pixels[p+c]!==v))throw Error(`Raster mismatch renderer=${renderer} ${width}x${height} at ${x},${y}; actual=${Array.from(pixels.slice(p,p+4))} expected=${expected} destination=${dx},${dy}`);
            rasterPixels++;
          }
        }
        cases.push({renderer,webglVersion:fixture.webglVersion,width,height,active});
      }
      fixture.dispose();
    }
    document.getElementById('fullscreen-result').textContent=JSON.stringify({pass:true,borderPixels,rasterPixels,cases},null,2);
  } catch(error){document.getElementById('fullscreen-result').textContent=error.stack;}
};
function create(rendererType,presentationScale=1) {
  const bus = new ZX_Bus(), display = new ZX_Display();
  let flash;
  display.connect(bus, {setInterval(fn) {flash=fn;}, setTimeout(fn) {fn();}});
  bus.opt('RENDERING_PARAMS',{scale:presentationScale,scaleType:1,rendererType,renderOnAnimationFrame:false});
  bus.opt('SEMICOLORS',true);
  const canvases=[document.createElement('canvas'),document.createElement('canvas'),document.createElement('canvas')];
  canvases.forEach((canvas,index)=>{const scale=index||rendererType===1?presentationScale:2;canvas.width=(index?256:288)*scale;canvas.height=(index?192:224)*scale;});
  display.bind(canvases);
  const visible=canvases[0];
  const gl=rendererType===3?(visible.getContext('webgl2')||visible.getContext('webgl')):null;
  const webglVersion=gl?.getParameter(gl.VERSION);
  const wrapper=document.createElement('div');wrapper.append(visible);document.getElementById('screens').append(wrapper);
  // Release native GPU caches but retain the completed visible frame for inspection.
  const dispose=()=>{if(rendererType===3)for(const canvas of canvases.slice(1)){const gl=canvas.getContext('webgl2')||canvas.getContext('webgl');gl?.getExtension('WEBGL_lose_context')?.loseContext();}};
  return {bus,display,canvas:canvases[1],visible,layers:canvases,flash,rendererType,dispose,webglVersion};
}
function readVisible(fixture) {
  const canvas=fixture.visible,width=canvas.width,height=canvas.height;
  if(fixture.rendererType===1)return canvas.getContext('2d').getImageData(0,0,width,height).data;
  const gl=canvas.getContext('webgl2')||canvas.getContext('webgl'),raw=new Uint8Array(width*height*4),pixels=new Uint8Array(raw.length);
  gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,raw);
  for(let y=0;y<height;y++)pixels.set(raw.subarray((height-1-y)*width*4,(height-y)*width*4),y*width*4);
  return pixels;
}
document.getElementById('run').onclick=()=>{
  try {
    document.getElementById('screens').replaceChildren();
    const cpu=create(1,2),gpu=create(3);let mismatchedBytes=0,comparedBytes=0;
    for(let seed=0;seed<16;seed++) {
      for(let i=0;i<6912;i++) {
        const value=i<6144?(i*73+(i>>5)+seed*17)&255:((i*11+seed*19)&255);
        cpu.bus.mem_write(0x4000+i,value);gpu.bus.mem_write(0x4000+i,value);
      }
      if(seed===8){cpu.flash();gpu.flash();}
      cpu.display.force_redraw();gpu.display.force_redraw();
      const expected=readVisible(cpu),actual=readVisible(gpu);
      for(let p=0;p<expected.length;p++)if(expected[p]!==actual[p])mismatchedBytes++;
      comparedBytes+=expected.length;
    }
    gpu.dispose();
    document.getElementById('result').textContent=JSON.stringify({webglVersion:gpu.webglVersion,patterns:16,comparedBytes,mismatchedBytes,nativeResolution:[256,192],visiblePresentation:[576,448],passed:mismatchedBytes===0},null,2);
  } catch(error) {document.getElementById('result').textContent='FAILED: '+error.message;}
};
</script></body></html>
<script>
document.getElementById('rows').onclick=()=>{
  try {
    document.getElementById('screens').replaceChildren();
    document.getElementById('row-screens').replaceChildren();
    let comparedPixels=0,mismatchedPixels=0,seamPixels=0,seamMismatches=0,borderOnlyPixels=0,borderOnlyMismatches=0,bankFlipBytes=0,bankFlipMismatches=0;
    const rowAddress=(y,column)=>Math.floor(y/64)*2048+(y%8)*256+Math.floor((y%64)/8)*32+column;
    for(const [type,scale] of [[1,1],[1,2],[3,1]]) {
      const fixture=create(type,scale),outputScale=type===3?2:scale,width=256*outputScale,height=192*outputScale;
      const bankFrames=new Map();
      for(const bank of [5,7]) {
        fixture.bus.var_write('port_7ffd_value',bank===7?15:0);
        const base=bank===7?0xc000:0x4000;
        const bytes=new Uint8Array(6144);
        {
          // White paper and border must be continuous across every pixel of
          // the actual visible surface, including the four screen boundaries.
          fixture.bus.var_write('port_fe_value',7);
          for(let a=0;a<768;a++)fixture.bus.mem_write(base+6144+a,0x38);
          fixture.display.force_redraw();
          const frame=readVisible(fixture);
          for(let p=0;p<frame.length;p+=4){
            if(frame[p]!==191||frame[p+1]!==191||frame[p+2]!==191||frame[p+3]!==255)seamMismatches++;
            seamPixels++;
          }
          fixture.bus.var_write('port_fe_value',2);fixture.display.force_redraw();
          const red=readVisible(fixture),fw=288*outputScale,fh=224*outputScale,b=16*outputScale;
          for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){
            const p=(y*fw+x)*4,inside=x>=b&&x<fw-b&&y>=b&&y<fh-b;
            if(red[p]!==191||red[p+1]!== (inside?191:0)||red[p+2]!== (inside?191:0)||red[p+3]!==255)borderOnlyMismatches++;
            borderOnlyPixels++;
          }
          fixture.bus.var_write('port_fe_value',7);fixture.display.force_redraw();
        }
        for(let y=0;y<192;y++)for(let column=0;column<32;column++) {
          // Each row has its own code; the right half is a one-line comb.
          const bits=column<16?((y+column*29)^(y>>3))&255:(y%2?255:0);
          bytes[rowAddress(y,column)]=bits;
          fixture.bus.mem_write(base+rowAddress(y,column),bits);
        }
        for(let a=0;a<768;a++)fixture.bus.mem_write(base+6144+a,0x47);
        for(const incremental of [false,true]) {
          if(incremental)for(let y=0;y<192;y++) {
            const address=rowAddress(y,(y*7)%32);
            bytes[address]^=255;fixture.bus.mem_write(base+address,bytes[address]);
          }
          fixture.display.force_redraw();
          const actual=readVisible(fixture),border=16*outputScale,frameWidth=288*outputScale;
          for(let y=0;y<height;y++)for(let x=0;x<width;x++) {
            const sourceX=Math.floor(x/outputScale),sourceY=Math.floor(y/outputScale);
            const value=(bytes[rowAddress(sourceY,Math.floor(sourceX/8))]&(128>>(sourceX%8)))?255:0;
            const p=((y+border)*frameWidth+x+border)*4;
            if(actual[p]!==value||actual[p+1]!==value||actual[p+2]!==value||actual[p+3]!==255)mismatchedPixels++;
            comparedPixels++;
          }
        }
        bankFrames.set(bank,readVisible(fixture));
      }
      for(const bank of [5,7]){
        fixture.bus.var_write('port_7ffd_value',bank===7?15:0);fixture.display.force_redraw();
        const actual=readVisible(fixture),expected=bankFrames.get(bank);
        for(let p=0;p<actual.length;p++)if(actual[p]!==expected[p])bankFlipMismatches++;
        bankFlipBytes+=actual.length;
      }
      if(scale===2||type===3) {
        const wrapper=document.createElement('div'),label=document.createElement('p'),canvas=fixture.visible;
        label.textContent=type===1?'Canvas: one full-frame surface':'WebGL: one full-frame surface';
        canvas.style.cssText=`width:${576/devicePixelRatio}px;height:${448/devicePixelRatio}px;image-rendering:pixelated`;
        wrapper.append(label,canvas);document.getElementById('row-screens').append(wrapper);
      }
      fixture.dispose();
    }
    document.getElementById('rows-result').textContent=JSON.stringify({banks:[5,7],rows:192,incrementalWrites:true,canvasPresentationSizes:[[256,192],[512,384]],comparedPixels,mismatchedPixels,seamPixels,seamMismatches,borderOnlyPixels,borderOnlyMismatches,bankFlipBytes,bankFlipMismatches,devicePixelRatio,passed:mismatchedPixels===0&&seamMismatches===0&&borderOnlyMismatches===0&&bankFlipMismatches===0},null,2);
  }catch(error){document.getElementById('rows-result').textContent='FAILED: '+error.stack;}
};
</script>
<script type="module">
import { SpectrumPlayer } from './emulator.js';
document.getElementById('switch').onclick=async()=>{
  const player=new SpectrumPlayer(document.getElementById('fixture'));
  try {
    player.setRenderer('webgl');await player.initialize();
    const bytes=new Uint8Array(await (await fetch('disks/ZX-video-refined_part02.trd')).arrayBuffer());
    player.mount(bytes,true);player.pause(true);
    const snapshot=()=>JSON.stringify({cpu:player.hw.cpu.get_state(),paging:player.hw.bus.var_read('port_7ffd_value'),
      memory:Array.from({length:65536},(_,address)=>player.hw.bus.mem_read(address)),disk:player.hw.disk.get_state()});
    const before=snapshot();player.setRenderer('canvas');
    const canvasScreen=document.querySelector('#fixture .screen-layer');
    if(canvasScreen.width!==512||canvasScreen.height!==384)throw new Error('Canvas presentation must be 512 x 384');
    if([...document.querySelectorAll('#fixture canvas')].filter(c=>c.style.display!=='none').length!==1)throw new Error('Canvas must have a single visible presentation surface');
    player.setRenderer('webgl');
    if(snapshot()!==before)throw new Error('Renderer switch changed machine state');
    if([...document.querySelectorAll('#fixture canvas')].filter(c=>c.style.display!=='none').length!==1)throw new Error('WebGL must have a single visible presentation surface');
    const canvas=document.querySelector('#fixture .border-layer');
    const gl=canvas.getContext('webgl2')||canvas.getContext('webgl');
    const extension=gl.getExtension('WEBGL_lose_context');
    if(!extension)throw new Error('GPU context-loss extension unavailable');
    await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(new Error('Canvas recovery timeout')),3000);
      player.onRendererChanged=(actual,fallback)=>{if(actual==='canvas'&&fallback){clearTimeout(timer);resolve();}};
      extension.loseContext();
    });
    if(snapshot()!==before)throw new Error('GPU recovery changed machine state');
    player.setRenderer('webgl');
    const bank=document.querySelector('#fixture .screen-layer'),bankGl=bank.getContext('webgl2')||bank.getContext('webgl');
    await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(new Error('Hidden bank context-loss timeout')),3000);
      player.onRendererChanged=(actual,fallback)=>{if(actual==='canvas'&&fallback){clearTimeout(timer);resolve();}};
      bankGl.getExtension('WEBGL_lose_context').loseContext();
    });
    if(snapshot()!==before)throw new Error('Bank context recovery changed machine state');
    const availableContext=WebGLRenderer.prototype._glGetContext;
    try {
      WebGLRenderer.prototype._glGetContext=()=>null;
      player.setRenderer('webgl');
      if(player.activeRenderer!=='canvas'||snapshot()!==before)throw new Error('Unavailable WebGL fallback changed machine state');
    } finally {WebGLRenderer.prototype._glGetContext=availableContext;}
    document.getElementById('switch-result').textContent=JSON.stringify({switchPreservesMemoryAndCpu:true,
      visibleAndHiddenContextLossFallsBackToCanvas:true,unavailableWebglFallsBackToCanvas:true,recoveryPreservesMemoryAndCpu:true,nativeScreen:[256,192],singleVisibleSurfaceBothModes:true,visiblePresentation:[576,448],passed:true},null,2);
  }catch(error){document.getElementById('switch-result').textContent='FAILED: '+error.message;}
  finally{clearInterval(player.activityTimer);player.hw?.clock.stop();}
};
</script>
